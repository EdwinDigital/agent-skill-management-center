[package]
name = "agent-skills-management-center"
version = "1.1.1"
description = "Agent SMC desktop shell"
authors = ["Agent SMC"]
edition = "2021"

[lib]
name = "agent_skills_management_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
