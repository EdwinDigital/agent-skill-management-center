name: Bug report
description: Report a reproducible Agent SMC defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Before filing, search existing issues and remove tokens, private Skill content, customer data, and personal paths. Security vulnerabilities must be reported privately through the Security tab.
  - type: input
    id: version
    attributes:
      label: Agent SMC version
      description: Release tag or commit SHA
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS ARM64 desktop
        - Windows x64 desktop
        - Windows ARM64 desktop
        - Web development mode
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and architecture
      placeholder: macOS 15.0 / Apple M3 or Windows 11 / x64
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove tokens, private Skill content, customer data, and personal paths.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: This is not a security vulnerability.
          required: true
        - label: I removed sensitive information.
          required: true
